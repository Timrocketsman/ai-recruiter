name: TimLabs reviewed Pages recovery (manual only)
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact full commit SHA reviewed for public-only export; dry export grants no content or release acceptance
        required: true
        type: string
      manifest_sha256:
        description: SHA256 of exact public-file manifest; publication requires separate source/legal/ROOT gates
        required: true
        type: string
      upload_artifact:
        description: Upload public artifact only after ROOT verifies remaining free storage and zero paid spend
        type: boolean
        default: false
      publish:
        description: Deploy only after independent ROOT provider/source gates; false builds artifact only
        type: boolean
        default: false
permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: timlabs-reviewed-pages-recovery
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'Timrocketsman/ai-recruiter' && github.event.repository.private == false && github.ref == 'refs/heads/main' && github.actor == 'Timrocketsman'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out trusted control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4, resolved read-only 2026-11-07
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Check exact input shape before checkout
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          MANIFEST_SHA: ${{ inputs.manifest_sha256 }}
        run: |
          python3 - <<'PY'
          import os,re
          assert re.fullmatch('[0-9a-f]{40}',os.environ['REVIEWED_SHA'])
          assert re.fullmatch('[0-9a-f]{64}',os.environ['MANIFEST_SHA'])
          PY
      - name: Check out exact public snapshot for bounded export
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.reviewed_sha }}
          path: snapshot
          persist-credentials: false
      - name: Export exact reviewed files; never execute snapshot scripts
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          MANIFEST_SHA: ${{ inputs.manifest_sha256 }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          python3 control/.github/scripts/export_pages_release.py snapshot "control/.github/pages-releases/$REVIEWED_SHA.json" "$REVIEWED_SHA" "$MANIFEST_SHA" _site | tee "$RUNNER_TEMP/public-export-proof.json"
      - name: Upload immutable public Pages artifact
        if: inputs.upload_artifact == true || inputs.publish == true
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # official v4; transitive upload-artifact is fullSHA pinned
        with:
          path: _site
          retention-days: 1
  deploy:
    if: inputs.publish == true && github.repository == 'Timrocketsman/ai-recruiter' && github.event.repository.private == false && github.ref == 'refs/heads/main' && github.actor == 'Timrocketsman'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed artifact once
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # official v4
        with:
          timeout: 600000
          error_count: 3
          artifact_name: github-pages
