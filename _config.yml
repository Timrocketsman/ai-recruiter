# Only exclude service files. Preserve Jekyll 3 and GitHub Pages defaults.
exclude:
  - "SESSIONS.md"
  - "tools"
  - "templates"
  - "scripts"
  - "tests"
  - "knowledge"
  - "secrets"
  - "private"
  - "runtime"
  - "agent_profile"
  - "backups"
  - "data/content_plan.json"
  - "data/channel_audit_20261019.json"
  - "media/covers/*.paper"
  - "**/*.bak-*"
  - ".github"
  - "Gemfile"
  - "Gemfile.lock"
  - "node_modules"
  - "vendor/bundle/"
  - "vendor/cache/"
  - "vendor/gems/"
  - "vendor/ruby/"
  - "CNAME"
  - ".sass-cache"
  - ".jekyll-cache"
  - "gemfiles"
